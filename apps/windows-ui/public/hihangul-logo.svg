<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="HiHangul logo">
  <defs>
    <linearGradient id="gradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3DD6C6"/>
      <stop offset="60%" stop-color="#1D67C7"/>
      <stop offset="100%" stop-color="#3A1BA8"/>
    </linearGradient>
    <linearGradient id="gradPink" x1="0%" y1="50%" x2="100%" y2="50%">
