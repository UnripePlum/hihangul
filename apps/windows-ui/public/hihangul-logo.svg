  <ellipse cx="110" cy="188" rx="52" ry="10" fill="#1E2338" opacity="0.2" filter="url(#softShadow)" />

  <circle cx="77" cy="92" r="16" fill="url(#gradDot)" />
  <rect x="97" y="58" width="20" height="72" rx="10" fill="url(#gradV)" />
  <circle cx="107" cy="58" r="12" fill="#35CFC3" />
  <rect x="58" y="108" width="98" height="14" rx="7" fill="url(#gradPink)" />
  <rect x="118" y="136" width="14" height="42" rx="7" fill="url(#gradBlue)" />
  <rect x="84" y="130" width="48" height="14" rx="7" fill="url(#gradBlue)" />
  <rect x="118" y="92" width="30" height="14" rx="7" fill="url(#gradOrange)" />
